version: "3.7"

x-default-logging: &default
  {}

x-loki-logging: &loki
  driver: loki
  options:
    loki-url: http://localhost:3100/loki/api/v1/push
    mode: non-blocking
    max-buffer-size: 4m
    loki-retries: "3"

x-log-config: &log-config
  # update this value to *loki if needed to see logs in grafana dashboard.
  <<: *default

services:
  bunkerweb:
    image: ${BUNKERWEB_IMAGE_NAME:?}:${BUNKERWEB_IMAGE_TAG:?}
    restart: always
    profiles: ["waf"]
    volumes:
      - ${CERTIFICATE_PATH}/fullchain.pem:/var/cache/bunkerweb/misc/default-server-cert.pem
      - ${CERTIFICATE_PATH}/privkey.pem:/var/cache/bunkerweb/misc/default-server-cert.key
    ports:
      - "${BUNKERWEB_HTTP_PORT}:8080"
      - "${BUNKERWEB_HTTPS_PORT}:8443"
    labels:
      - "bunkerweb.INSTANCE=yes"
    environment:
      - SERVER_NAME=${BUNKERWEB_SERVER_NAME_DOMAINS}
      - MULTISITE=yes
      - API_WHITELIST_IP=172.17.0.0/16 172.18.0.0/16
      - USE_REVERSE_PROXY=yes
      - REVERSE_PROXY_URL=/
      - ${BUNKERWEB_MAIN_DOMAIN}_REVERSE_PROXY_HOST=https://proxy
      - ${BUNKERWEB_ERP_DOMAIN}_REVERSE_PROXY_HOST=http://odoo:8069
      - ALLOWED_METHODS=GET|POST|HEAD|PROPFIND|DELETE|PUT|MKCOL|MOVE|COPY|PROPPATCH|REPORT|OPTIONS
      - REVERSE_PROXY_INTERCEPT_ERRORS=no
      - ${BUNKERWEB_ERP_DOMAIN}_COOKIE_FLAGS=* SameSite=Lax
      - USE_BAD_BEHAVIOR=no
      - USE_LIMIT_REQ=no
      - LOG_LEVEL=info
      - USE_WHITELIST=no
      - USE_LIMIT_CONN=no
      - USE_BUNKERNET=no\
      - ${BUNKERWEB_MAIN_DOMAIN}_PERMISSIONS_POLICY=accelerometer=(), ambient-light-sensor=(), attribution-reporting=(), autoplay=(), battery=(), bluetooth=(), browsing-topics=(), camera=(), compute-pressure=(), display-capture=(), encrypted-media=(), execution-while-not-rendered=(), execution-while-out-of-viewport=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), otp-credentials=(), payment=(), picture-in-picture=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(),serial=(), speaker-selection=(), storage-access=(), usb=(), web-share=(), window-management=(), xr-spatial-tracking=(), interest-cohort=(), sync-xhr=(self)
      - |
        CUSTOM_CONF_MODSEC_CRS_forbidden=
        SecRequestBodyNoFilesLimit 10485760
        SecAction "id:900220,phase:1,nolog,pass,t:none,setvar:tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json| |text/plain|"
        SecRule REQUEST_URI "@beginsWith /openmrs/pages/" "id:1001,phase:1,deny,status:403,log,msg:'Forbidden path'"
        SecRule REQUEST_URI "/openmrs/admin/maintenance/serverLog.form" "id:1002,phase:1,nolog,pass,ctl:ruleRemoveById=952100,ctl:ruleRemoveById=952110"
        SecRule REQUEST_URI "@beginsWith /openmrs/ws/rest/v1/bahmnicore/distro/meta/getFormDetail" "id:1003,phase:1,nolog,pass,ctl:ruleRemoveById=952100,ctl:ruleRemoveById=952110,ctl:ruleRemoveById=959100"

  bw-scheduler:
    image: ${BUNKERWEB_SCHEDULER_IMAGE_NAME:?}:${BUNKERWEB_SCHEDULER_IMAGE_TAG:?}
    restart: always
    profiles: ["waf"]
    depends_on:
      - bunkerweb
      - bw-docker
    volumes:
      - bw-data:/data
    environment:
      - DOCKER_HOST=tcp://bw-docker:2375

  bw-docker:
    image: ${BUNKERWEB_DOCKER_IMAGE_NAME:?}:${BUNKERWEB_DOCKER_IMAGE_TAG:?}
    restart: always
    profiles: ["waf"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - CONTAINERS=1
      - LOG_LEVEL=warning

  proxy:
    image: '${PROXY_IMAGE_NAME:?}:${PROXY_IMAGE_TAG:?}'
    restart: ${RESTART_POLICY}
    volumes:
    - ${CERTIFICATE_PATH}/privkey.pem:/etc/tls/key.pem
    - ${CERTIFICATE_PATH}/fullchain.pem:/etc/tls/cert.pem
    - "bahmni-patient-images:/home/bahmni/patient_images"
    - "./proxy/bahmni-proxy.conf:/usr/local/apache2/conf/bahmni-proxy.conf"
    - "./proxy/index.html:/usr/local/apache2/htdocs/index.html"  
    #- ./proxy/bahmni-proxy.conf:/etc/httpd/conf.d/bahmni-proxy.conf
    ports:
      - "${PROXY_HTTP_PORT}:80"
      - "${PROXY_HTTPS_PORT}:443"

  bahmni-config:
    image: '${CONFIG_IMAGE_NAME:?}:${CONFIG_IMAGE_TAG:?}'   
    restart: ${RESTART_POLICY}
    volumes:
      - '${CONFIG_VOLUME:?}:/usr/local/bahmni_config'

  openmrs:
    profiles: ['emr']
    restart: ${RESTART_POLICY}
    image: '${OPENMRS_IMAGE_NAME}:${OPENMRS_IMAGE_TAG}'
    environment:
      TZ: ${TZ}
      OMRS_DB_NAME: ${OPENMRS_DB_NAME:?}
      OMRS_DB_HOSTNAME: ${OPENMRS_DB_HOST:?}
      OMRS_DB_USERNAME: ${OPENMRS_DB_USERNAME:?}
      OMRS_DB_PASSWORD: ${OPENMRS_DB_PASSWORD:?}
      OMRS_CREATE_TABLES: ${OPENMRS_DB_CREATE_TABLES}
      OMRS_AUTO_UPDATE_DATABASE: ${OPENMRS_DB_AUTO_UPDATE}
      OMRS_MODULE_WEB_ADMIN: ${OPENMRS_MODULE_WEB_ADMIN}
      # OMRS_DEV_DEBUG_PORT: ${OMRS_DEV_DEBUG_PORT}
      OMRS_JAVA_SERVER_OPTS: ${OMRS_JAVA_SERVER_OPTS}
      OMRS_JAVA_MEMORY_OPTS: ${OMRS_JAVA_MEMORY_OPTS}
      OPENELIS_HOST: ${OPENELIS_HOST:?}
      OPENELIS_PORT: ${OPENELIS_PORT:?}
      OPENELIS_ATOMFEED_USER: ${OPENELIS_ATOMFEED_USER:?}
      OPENELIS_ATOMFEED_PASSWORD: ${OPENELIS_ATOMFEED_PASSWORD:?}
      #Mail config
      SEND_MAIL: ${SEND_MAIL}
      MAIL_TRANSPORT_PROTOCOL: ${MAIL_TRANSPORT_PROTOCOL}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE}
      MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE}
      MAIL_DEBUG: ${MAIL_DEBUG}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      #HIP-OMOD Variables. Refer here https://github.com/BahmniIndiaDistro/openmrs-module-hip/tree/master#docker-setup
      PHONE_NUMBER: ${PHONE_NUMBER:?}
      OMRS_DOCKER_ENV: ${OPENMRS_DOCKER_ENV}
      OMRS_C3P0_MAX_SIZE: ${OMRS_C3P0_MAX_SIZE}
      OMRS_DB_EXTRA_ARGS: ${OMRS_DB_EXTRA_ARGS}
      WEIGHT_CONCEPT_UUID: ${WEIGHT_CONCEPT_UUID}
      HEIGHT_CONCEPT_UUID: ${HEIGHT_CONCEPT_UUID}
      LUCENE_MATCH_TYPE: ${LUCENE_MATCH_TYPE}
      DOCUMENT_MAX_SIZE_MB: ${DOCUMENT_MAX_SIZE_MB}
    # ports:
      # - ${OMRS_DEV_DEBUG_PORT}:${OMRS_DEV_DEBUG_PORT}
    volumes:
      - '${CONFIG_VOLUME:?}:/etc/bahmni_config/:ro'
      - 'configuration_checksums:/openmrs/data/configuration_checksums'
      - 'bahmni-patient-images:/home/bahmni/patient_images'
      - 'bahmni-document-images:/home/bahmni/document_images'
      - "bahmni-lab-results:/home/bahmni/uploaded_results"
      - 'bahmni-clinical-forms:/home/bahmni/clinical_forms'
      - "bahmni-uploaded-files:/home/bahmni/uploaded-files"
      - 'sms-token:/openmrs/data/sms-token'
      - 'openmrs-index:/openmrs/data/lucene'
    depends_on:
      - openmrsdb

  openmrsdb:
    image: ${OPENMRS_DB_IMAGE_NAME:?}:${OPENMRS_DB_IMAGE_TAG:?}
    restart: always
    profiles: ["emr"]
    command: "--character-set-server=utf8 --collation-server=utf8_general_ci --sql-mode=${OPENMRS_DB_SQL_MODES:?}"
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${OPENMRS_DB_NAME:?}
      MYSQL_USER: ${OPENMRS_DB_USERNAME:?}
      MYSQL_PASSWORD: ${OPENMRS_DB_PASSWORD:?}
    ports:
      - '3306:3306'
    volumes:
      - 'openmrsdbdata:/var/lib/mysql'
      - 'configuration_checksums:/configuration_checksums'

  bahmni-web:
    image: ${BAHMNI_WEB_IMAGE_NAME:?}:${BAHMNI_WEB_IMAGE_TAG:?}
    profiles: ["emr"]
    restart: ${RESTART_POLICY}
    volumes:
      # - "${BAHMNI_APPS_PATH:?}/ui/app/:/usr/local/apache2/htdocs/bahmni"
      # - "${BAHMNI_APPS_PATH:?}/ui/node_modules/@bower_components/:/usr/local/apache2/htdocs/bahmni/components"
      - '${CONFIG_VOLUME:?}:/usr/local/apache2/htdocs/bahmni_config/:ro'

  openelis:
    profiles: ["openelis","bahmni-standard"]
    image: '${OPENELIS_IMAGE_NAME:?}:${OPENELIS_IMAGE_TAG:?[ERROR]}'
    volumes:
      - "${CONFIG_VOLUME:?}:/etc/bahmni_config/:ro"
      - "bahmni-lab-results:/home/bahmni/uploaded_results"
      - "bahmni-uploaded-files:/home/bahmni/uploaded-files"
    environment:
      TZ: ${TZ}
      OPENMRS_HOST: ${OPENMRS_HOST}
      OPENMRS_PORT: ${OPENMRS_PORT:?}
      OPENMRS_ATOMFEED_USER: ${OPENMRS_ATOMFEED_USER:?}
      OPENMRS_ATOMFEED_PASSWORD: ${OPENMRS_ATOMFEED_PASSWORD:?}
      OPENELIS_DB_SERVER: ${OPENELIS_DB_SERVER}
    depends_on:
      openelisdb:
        condition: service_healthy
    logging: *log-config
    restart: ${RESTART_POLICY}

  openelisdb:
    profiles: ["openelis","bahmni-standard"]
    image: '${OPENELIS_DB_IMAGE_NAME:?[ERROR]}'
    volumes:
      - '${OPENELIS_DB_DUMP_PATH}:/resources/db-dump'
      - 'openelisdbdata:/var/lib/postgresql/data'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U clinlims']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${OPENELIS_DB_USER:?}
      POSTGRES_PASSWORD: ${OPENELIS_DB_PASSWORD:?}
      POSTGRES_DB: ${OPENELIS_DB_NAME:?}
    logging: *log-config
    restart: ${RESTART_POLICY}

  bahmni-lab:
    profiles: ["lab-lite","bahmni-lite","bahmni-standard","emr"]
    image: '${BAHMNI_LAB_IMAGE_NAME:?}:${BAHMNI_LAB_IMAGE_TAG:?}'
    logging: *log-config
    restart: ${RESTART_POLICY}
    environment:
      TZ: ${TZ}

  ipd:
    image: '${IPD_IMAGE_NAME:?}:${IPD_TAG:?}'
    container_name: ipd
    profiles: ["emr","bahmni-standard","bahmni-mart"]
    restart: ${RESTART_POLICY}
    # volumes:
    #   - "${IPD_PATH:?}/dist/federation/:/usr/local/apache2/htdocs/ipd"
    logging: *log-config

  db:
    container_name: db
    image: ${POSTGRES_IMAGE_NAME:?}:${POSTGRES_IMAGE_TAG:?}
    profiles: ["abdm"]
    restart: ${RESTART_POLICY}
    environment:
      TZ: ${ABDM_TZ}
      PGTZ: ${ABDM_TZ}
      POSTGRES_USER: ${HIP_DB_USER:?}
      POSTGRES_PASSWORD: ${HIP_DB_PASSWORD:?}
    ports:
      - "5433:5432"
    volumes:
      - postgresql:/var/lib/postgresql
      - postgresql_data:/var/lib/postgresql/data

  rabbitmq:
      image: ${RABBITMQ_IMAGE_NAME:?}:${RABBITMQ_IMAGE_TAG:?}
      profiles: ["abdm"]
      container_name: rabbitmq
      restart: ${RESTART_POLICY}
      environment:
      - TZ=${ABDM_TZ}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:?}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:?}
      - RABBITMQ_NODENAME=rabbit@localhost
      ports:
        - "5672:5672"
      volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  otp:
      image: ${OTP_SERVICE_IMAGE_NAME:?}:${OTP_SERVICE_IMAGE_TAG:?}
      profiles: ["abdm"]
      container_name: otp
      restart: ${RESTART_POLICY}
      depends_on:
        - db
      environment:
        TZ: ${ABDM_TZ}
        ASPNETCORE_URLS: http://0.0.0.0:80
        SmsService:ClinicName: ${HIU_NAME}
        whitelisted:numbers: ${OTP_WHITELIST_NUMBERS}
        ConnectionStrings:DefaultConnection:  Host=${OTP_DB_HOST};Port=${OTP_DB_PORT};Username=${POSTGRES_DB_USER};Password=${POSTGRES_DB_PASSWORD};Database=${OTP_DB_NAME};

  hiu-db-setup:
      image: ${HIU_DB_INITIALIZER_IMAGE_NAME:?}:${HIU_DB_INITIALIZER_IMAGE_TAG:?}
      profiles: ["abdm"]
      container_name: hiu-db-setup
      restart: ${RESTART_POLICY}
      environment:
        TZ: ${ABDM_TZ}
        PGTZ: ${ABDM_TZ}
        JAVA_TOOL_OPTIONS: '-Djdbc.url=${HIU_DB_URL:?} -Djdbc.username=${HIU_DB_USER:?} -Djdbc.password=${HIU_DB_PASSWORD:?} -Djdbc.database=${HIU_DB_NAME:?}'

  hip:
    container_name: hip
    image: ${HIP_IMAGE_NAME:?}:${HIP_IMAGE_TAG:?}
    profiles: ["abdm"]
    restart: ${RESTART_POLICY}
    ports:
      - "8000:80"
    depends_on:
      - db
      - otp
      - rabbitmq
    environment:
      TZ: ${ABDM_TZ}
      Bahmni:Name: ${HIU_NAME:?}
      Gateway:abhaNumberServiceUrl: ${ABHA_NUMBER_SERVICE_URL:?}
      Gateway:abhaAddressServiceUrl: ${ABHA_ADDRESS_SERVICE_URL:?}
      Gateway:clientSecret: ${ABDM_GATEWAY_CLIENT_SECRET:?}
      Gateway:clientId: ${ABDM_GATEWAY_CLIENT_ID:?}
      Gateway:url: ${ABDM_GATEWAY_URL:?}
      OpenMrs:url: ${OPENMRS_URL:?}
      OpenMrs:password: ${OPENMRS_PASSWORD:?}
      OpenMrs:phoneNumber: ${PHONE_NUMBER:?}
      Gateway:cmSuffix: ${ABDM_CONSENT_MANAGEMENT_SUFFIX:?}
      OtpService:BaseUrl: ${HIP_OTP_SERVICE_URL:?}
      hip:url: ${HIP_URL_GLOBAL:?}
      HEALTH_CHECK_DURATION: ${HIP_OPENMRS_HEALTH_CHECK_DURATION:?}
      Cors:allowedOrigins: ${HIP_CORS_ALLOWED_ORIGIN:?}
      Bahmni:Id: ${HIU_ID:?}
      rabbit:HostName: ${RABBITMQ_HOST:?}
      rabbit:UserName: ${RABBITMQ_USERNAME:?}
      rabbit:Password: ${RABBITMQ_PASSWORD:?}
      ConnectionStrings:DefaultConnection: Host=${HIP_DB_HOST:?};Port=${HIP_DB_PORT:?};Username=${POSTGRES_DB_USER:?};Password=${POSTGRES_DB_PASSWORD:?};Database=${HIP_DB_NAME:?};
      # Serilog:MinimumLevel:Default: "Debug"

  hiu:
    image: ${HIU_IMAGE_NAME:?}:${HIU_IMAGE_TAG:?}
    profiles: ["abdm"]
    container_name: hiu
    restart: ${RESTART_POLICY}
    environment:
      TZ: ${ABDM_TZ}
      HIU_ID: ${HIU_ID:?}
      HIU_NAME: ${HIU_NAME:?}
      IDENTITY_JWK_URL: ${ABDM_IDENTITY_JWK_URL:?}
      DATA_PUSH_URL: ${HIU_DATA_PUSH_URL:?}
      CONSENT_NOTIFICATION_URL: ${ABDM_CONSENT_NOTIFICATION_URL:?}
      CONSENT_MANAGEMENT_SUFFIX:  ${HIU_ABDM_CONSENT_MANAGEMENT_SUFFIX:?}
      CONSENT_MANAGEMENT_URL: ${ABDM_CONSENT_MANAGEMENT_URL:?}
      DEFAULT_PAGE_SIZE: ${HIU_DEFAULT_PAGE_SIZE:?}
      MAX_PAGE_SIZE: ${HIU_MAX_PAGE_SIZE:?}
      LOCAL_STORAGE_PATH: ${HIU_LOCAL_STORAGE_PATH}
      HIU_CLIENT_ID: ${ABDM_GATEWAY_CLIENT_ID:?}
      HIU_CLIENT_SECRET: ${ABDM_GATEWAY_CLIENT_SECRET:?}
      POSTGRES_HOST: ${HIU_DB_HOST:?}
      POSTGRES_PORT: ${HIU_DB_PORT}
      CONSENT_MANAGER_DB_NAME: ${HIU_DB_NAME:?}
      POSTGRES_USER: ${HIU_DB_USER:?}
      POSTGRES_PASSWORD: ${HIU_DB_PASSWORD:?}
      DB_CONNECTION_POOL_SIZE: ${HIU_DB_CONNECTION_POOL_SIZE:?}
      OFFSET_IN_DAYS: ${HIU_OFFSET_IN_DAYS:?}
      USING_GATEWAY: ${HIU_USING_GATEWAY:?}
      GATEWAY_BASE_URL: ${ABDM_GATEWAY_BASE_URL:?}
      GATEWAY_REQUEST_TIMEOUT: ${HIU_GATEWAY_REQUEST_TIMEOUT:?}
      GATEWAY_JWK_URL: ${ABDM_GATEWAY_JWK_URL:?}
      HFR_AFFINITY_DOMAINS: ${ABDM_HFR_AFFINITY_DOMAINS:?}
      RABBITMQ_HOST: ${HIU_RABBITMQ_HOST:?}
      RABBITMQ_PORT: ${HIU_RABBITMQ_PORT:?}
      RABBITMQ_USERNAME: ${HIU_RABBITMQ_USERNAME:?}
      RABBITMQ_PASSWORD: ${HIU_RABBITMQ_PASSWORD:?}
      MAX_IN_MEMORY_SIZE: ${HIU_MAX_IN_MEMORY_SIZE:?}
      DATA_FLOW_CONSENT_REQUEST_WAIT_TIME: ${HIU_DATA_FLOW_CONSENT_REQUEST_WAIT_TIME:?}
      DATA_FLOW_CONSENT_ARTEFACT_WAIT_TIME: ${HIU_DATA_FLOW_CONSENT_ARTEFACT_WAIT_TIME:?}
      DATA_FLOW_PART_WAIT_TIME: ${HIU_DATA_FLOW_PART_WAIT_TIME:?}
      ABHA_ADDRESS_BASE_URL: ${ABHA_ADDRESS_SERVICE_URL:?}
      OPENMRS_BASE_URL: ${OPENMRS_URL}
      OPENMRS_USERNAME: ${OPENMRS_USERNAME}
      OPENMRS_PASSWORD: ${OPENMRS_PASSWORD}
    ports:
      - "9053:8003"
    volumes:
      - 'hiuData:${HIU_LOCAL_STORAGE_PATH}:rw'

  hiu-ui:
    image: ${HIU_UI_IMAGE_NAME:?}:${HIU_UI_IMAGE_TAG:?}
    profiles: ["abdm"]
    container_name: hiu-ui
    restart: ${RESTART_POLICY}
    environment:
      TZ: ${ABDM_TZ}
      BACKEND_BASE_URL: ${HIU_BACKEND_BASE_URL:?}
      BASE_NAME: ${HIU_UI_BASE_NAME:?}
      TIMEZONE_OFFSET: ${TIMEZONE_OFFSET:?}
      TITLE: "HIU"
      DICOM_SERVER_PATH: '/'
      VIEWER_PAGE: "/viewer/"
    ports:
      - "5000:5000"

  hip-atomfeed-listener:
    container_name: hip-atomfeed-listener
    image: ${HIP_ATOMFEED_IMAGE_NAME:?}:${HIP_ATOMFEED_IMAGE_TAG:?}
    profiles: ["abdm"]
    restart: ${RESTART_POLICY}
    environment:
      TZ: ${ABDM_TZ}
      DATABASE_URL: ${HIP_ATOMFEED_DB_URL:?}
      DATABASE_NAME: ${HIP_ATOMFEED_DB_NAME:?}
      DATABASE_USERNAME: ${HIP_DB_USER:?}
      DATABASE_PASSWORD: ${HIP_DB_PASSWORD:?}
      OPENMRS_URL: ${OPENMRS_SESSION_URL:?}
      OPENMRS_ENCOUNTER_FEED_URL: ${OPENMRS_ENCOUNTER_FEED_URL:?}
      OPENMRS_USERNAME: ${OPENMRS_USERNAME:?}
      OPENMRS_PASSWORD: ${OPENMRS_PASSWORD:?}
      HIP_URL: ${HIP_URL:?}
      PHONE_NUMBER: ${PHONE_NUMBER:?}
    depends_on:
      - db

  reports:
    image: '${REPORTS_IMAGE_NAME:?}:${REPORTS_IMAGE_TAG:?}'
    profiles: [ "reports","emr" ]
    restart: ${RESTART_POLICY}
    environment:
      TZ: ${TZ}
      OPENMRS_DB_HOST: ${OPENMRS_DB_HOST:?}
      OPENMRS_DB_NAME: ${OPENMRS_DB_NAME:?}
      OPENMRS_DB_USERNAME: ${MYSQL_ROOT_USERNAME:?}
      OPENMRS_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      OPENMRS_HOST: ${OPENMRS_HOST:?}
      OPENMRS_PORT: ${OPENMRS_PORT:?}
      OPENELIS_DB_SERVER: openelisdb
      REPORTS_DB_SERVER: reportsdb
      REPORTS_DB_NAME: ${REPORTS_DB_NAME:?}
      REPORTS_DB_USERNAME: ${REPORTS_DB_USERNAME:?}
      REPORTS_DB_PASSWORD: ${REPORTS_DB_PASSWORD:?}
      ODOO_DB_SERVER: odoodb
      ODOO_DB_USERNAME: ${ODOO_DB_USER:?}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:?}
    volumes:
      - '${CONFIG_VOLUME:?}:/etc/bahmni_config/:ro'
      - "bahmni-queued-reports:/home/bahmni/reports"
    depends_on:
      - reportsdb
      - openmrsdb
      - bahmni-web

  reportsdb:
    image: '${REPORTSDB_IMAGE_NAME:?}:${REPORTSDB_IMAGE_TAG:?}'
    profiles: ["reports","emr"]
    restart: ${RESTART_POLICY}
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${REPORTS_DB_NAME:?}
      MYSQL_USER: ${REPORTS_DB_USERNAME:?}
      MYSQL_PASSWORD: ${REPORTS_DB_PASSWORD:?}

  patient-documents:
     image: '${PATIENT_DOCUMENTS_NAME:?}:${PATIENT_DOCUMENTS_TAG:?}'
     ports:
       - '8099:80'
     profiles: ["emr"]
     restart: ${RESTART_POLICY}
     volumes:
       - 'bahmni-document-images:/usr/share/nginx/html/document_images'
       - 'bahmni-lab-results:/usr/share/nginx/html/uploaded_results'
       - 'bahmni-uploaded-files:/usr/share/nginx/html/uploaded-files'
     environment:
       - TZ=${TZ}
       - OPENMRS_HOST=${OPENMRS_HOST:?}

  appointments:
    image: ${APPOINTMENTS_IMAGE_NAME:?}:${APPOINTMENTS_IMAGE_TAG:?}
    profiles: ["emr","appointments"]
    restart: ${RESTART_POLICY}
#    volumes:
#      - "${APPOINTMENTS_PATH:?}/dist/:/usr/local/apache2/htdocs/appointments"

  implementer-interface:
    image: '${IMPLEMENTER_INTERFACE_IMAGE_NAME:?}:${IMPLEMENTER_INTERFACE_IMAGE_TAG:?}'
    profiles: ["emr","implementer-interface"]
    restart: ${RESTART_POLICY}
    #volumes:
    #  - "${IMPLEMENTER_INTERFACE_CODE_PATH:?}/dist/:/usr/local/apache2/htdocs/implementer_interface/"
    depends_on:
      - openmrs

  abha-verification:
