    restart: ${RESTART_POLICY}
    environment:
      TZ: ${TZ}

  crater-atomfeed:
    image: '${CRATER_ATOMFEED_IMAGE_NAME:?}:${CRATER_ATOMFEED_IMAGE_TAG:?}'
    restart: ${RESTART_POLICY}
    profiles: ["crater"]
    environment:
      TZ: ${TZ}
      OPENMRS_HOST: ${OPENMRS_HOST:?}
      OPENMRS_PORT: ${OPENMRS_PORT:?}
      OPENMRS_ATOMFEED_USER: ${OPENMRS_ATOMFEED_USER}
      OPENMRS_ATOMFEED_PASSWORD: ${OPENMRS_ATOMFEED_PASSWORD}
      CRATER_ATOMFEED_DB_HOST: ${CRATER_ATOMFEED_DB_HOST:?}
      CRATER_ATOMFEED_DB_PORT: ${CRATER_ATOMFEED_DB_PORT:?}
      CRATER_USERNAME: ${CRATER_ADMIN_EMAIL}
      CRATER_PASSWORD: ${CRATER_ADMIN_PASSWORD}
      CRATER_ATOMFEED_DB_USERNAME: ${CRATER_ATOMFEED_DB_USERNAME}
      CRATER_ATOMFEED_DB_PASSWORD: ${CRATER_ATOMFEED_DB_PASSWORD}
      CRATER_ATOMFEED_DB_NAME: ${CRATER_ATOMFEED_DB_NAME}
      CRATER_URL: ${CRATER_URL}
      CRATER_CURRENCY_ID: ${CRATER_CURRENCY_ID}

  crater-atomfeed-db:
    platform: linux/amd64
    image: '${CRATER_ATOMFEED_DB_IMAGE_NAME:?}:${CRATER_ATOMFEED_DB_IMAGE_TAG:?}'
    restart: ${RESTART_POLICY}
    profiles: ["crater"]
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${CRATER_ATOMFEED_DB_NAME:?}
      MYSQL_USER: ${CRATER_ATOMFEED_DB_USERNAME:?}
      MYSQL_PASSWORD: ${CRATER_ATOMFEED_DB_PASSWORD:?}

  crater-php:
    image: '${CRATER_PHP_IMAGE_NAME:?}:${CRATER_PHP_IMAGE_TAG:?}'
    profiles: ["crater"]
    restart: ${RESTART_POLICY}
    working_dir: /var/www/
    volumes:
     - 'crater-app-data:/var/www/storage/app/public'
    environment:
      TZ: ${TZ}
      APP_URL: ${CRATER_APP_URL:?}
      DB_HOST: ${CRATER_DB_HOST:?}
      DB_PORT: ${CRATER_DB_PORT:?}
      DB_DATABASE: ${CRATER_DB_DATABASE:?}
      DB_USERNAME: ${CRATER_DB_USERNAME:?}
      DB_PASSWORD: ${CRATER_DB_PASSWORD:?}
      SANCTUM_STATEFUL_DOMAINS: ${CRATER_SANCTUM_STATEFUL_DOMAINS:?}
      SESSION_DOMAIN: ${CRATER_SESSION_DOMAIN:?}
      AUTO_INSTALL: ${CRATER_AUTO_INSTALL:?}
      ADMIN_NAME: ${CRATER_ADMIN_NAME:?}
      ADMIN_EMAIL: ${CRATER_ADMIN_EMAIL:?}
      ADMIN_PASSWORD: ${CRATER_ADMIN_PASSWORD:?}
      COMPANY_NAME: ${CRATER_COMPANY_NAME:?}
      COMPANY_SLUG: ${CRATER_COMPANY_SLUG:?}
      COUNTRY_ID: ${CRATER_COUNTRY_ID:?}
      APP_DEBUG: ${CRATER_APP_DEBUG:?}
      CRATER_DEFAULT_CURRENCY: ${CRATER_DEFAULT_CURRENCY:?}

  crater-nginx:
    image: '${CRATER_NGINX_IMAGE_NAME:?}:${CRATER_NGINX_IMAGE_TAG:?}'
    profiles: ["crater"]
    restart: ${RESTART_POLICY}
    volumes:
     - 'crater-app-data:/var/www/public/storage'
    ports:
      - 444:443

  craterdb:
    image: '${CRATER_DB_IMAGE_NAME:?}:${CRATER_DB_IMAGE_TAG:?}'
    profiles: ["crater"]
    restart: ${RESTART_POLICY}
    volumes:
      - craterdb:/var/lib/mysql
    environment:
      TZ: ${TZ}
      MYSQL_USER: ${CRATER_DB_USERNAME:?}
      MYSQL_PASSWORD: ${CRATER_DB_PASSWORD:?}
      MYSQL_DATABASE: ${CRATER_DB_DATABASE:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    ports:
      - '33006:3306'

  metabasedb:
    image: '${METABASE_POSTGRES_IMAGE_NAME:?}:${METABASE_POSTGRES_IMAGE_TAG:?}'
    restart: ${RESTART_POLICY}
    profiles: ["metabase"]
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${METABASE_DB_NAME:?}
      POSTGRES_USER: ${METABASE_DB_USER:?}
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:?}
    volumes:
      - 'metabase-data:/var/lib/postgresql/data'

  metabase:
    image: '${METABASE_IMAGE_NAME:?}:${METABASE_IMAGE_TAG:?}'
    restart: ${RESTART_POLICY}
    profiles: ["metabase"]
    environment:
      TZ: ${TZ}
      MB_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:?}
      MB_ADMIN_FIRST_NAME: ${METABASE_ADMIN_FIRST_NAME:?}
      MB_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:?}
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: ${METABASE_DB_NAME:?}
      MB_DB_PORT:  ${METABASE_DB_PORT:?}
      MB_DB_USER: ${METABASE_DB_USER:?}
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?}
      MB_DB_HOST: ${METABASE_DB_HOST:?}
      OPENMRS_DB_HOST: ${OPENMRS_DB_HOST:?}
      OPENMRS_DB_NAME: ${OPENMRS_DB_NAME:?}
      OPENMRS_DB_USERNAME: ${OPENMRS_DB_USERNAME:?}
      OPENMRS_DB_PASSWORD: ${OPENMRS_DB_PASSWORD:?}
      MART_DB_HOST: ${MART_DB_HOST:?}
      MART_DB_NAME: ${MART_DB_NAME:?}
      MART_DB_USERNAME: ${MART_DB_USERNAME:?}
      MART_DB_PASSWORD: ${MART_DB_PASSWORD:?}
    depends_on:
     - metabasedb

  martdb:
    image: '${BAHMNI_MART_DB_IMAGE_NAME:?}:${BAHMNI_MART_DB_IMAGE_TAG:?}'
    restart: ${RESTART_POLICY}
    profiles: ["bahmni-mart"]
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${MART_DB_NAME:?}
      POSTGRES_USER: ${MART_DB_USERNAME:?}
      POSTGRES_PASSWORD: ${MART_DB_PASSWORD:?}
    volumes:
      - 'mart-data:/var/lib/postgresql/data'

  mart:
    image: '${BAHMNI_MART_IMAGE_NAME:?}:${BAHMNI_MART_IMAGE_TAG:?}'
    restart: ${RESTART_POLICY}
    profiles: ["bahmni-mart"]
    environment:
      TZ: ${TZ}
      CRON_TIME: ${MART_CRON_TIME:?}
      MART_DB_HOST: ${MART_DB_HOST:?}
      MART_DB_NAME: ${MART_DB_NAME:?}
      MART_DB_USERNAME: ${MART_DB_USERNAME:?}
      MART_DB_PASSWORD: ${MART_DB_PASSWORD:?}
      OPENMRS_DB_HOST: ${OPENMRS_DB_HOST:?}
      OPENMRS_DB_NAME: ${OPENMRS_DB_NAME:?}
      OPENMRS_DB_USERNAME: ${OPENMRS_DB_USERNAME:?}
      OPENMRS_DB_PASSWORD: ${OPENMRS_DB_PASSWORD:?}
    depends_on:
     - martdb
     - openmrsdb
     - openmrs
    volumes:
     - 'bahmni-clinical-forms:/home/bahmni/clinical_forms'

  odoo:
    profiles: ["odoo","emr"]
    image: '${ODOO_IMAGE_NAME:?}:${ODOO_IMAGE_TAG:?[ERROR]}'
    restart: ${RESTART_POLICY}
    ports:
      - '8069:8069'
    volumes:
      - odooappdata:/var/lib/odoo
      - ${EXTRA_ADDONS_PATH}:/mnt/extra-addons
      - 'odoofilestore:/var/lib/odoo/filestore'
      - 'odooconfig:/etc/odoo'
      # # Uncomment the below volume only when you need to modify existing bahmni-addons. Also make sure to update the .env file variable with odoo-modules github repo cloned path.
      - ${BAHMNI_ODOO_MODULES_PATH}:/opt/bahmni-erp/bahmni-addons
    depends_on:
      odoodb:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      HOST: ${ODOO_DB_HOST}
      USER: ${ODOO_DB_USER}
      PASSWORD: ${ODOO_DB_PASSWORD}

  odoodb:
    profiles: ["odoo","emr"]
    image: '${ODOO_DB_IMAGE_NAME:?}:${ODOO_DB_IMAGE_TAG:?[ERROR]}'
    restart: ${RESTART_POLICY}
    ports:
      - '5431:5432'
    volumes:
      - '${ODOO_DB_DUMP_PATH}:/resources/db-dump'
      - 'odoodbdata:/var/lib/postgresql/data'
      - 'odoofilestore:/filestore'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U odoo']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      TZ: ${TZ}
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD}
      POSTGRES_USER: ${ODOO_DB_USER}

  odoo-connect:
    profiles: ["odoo","emr"]
    image: '${ODOO_CONNECT_IMAGE_NAME:?}:${ODOO_CONNECT_IMAGE_TAG:?[ERROR]}'
    restart: ${RESTART_POLICY}
    environment:
      TZ: ${TZ}
      IS_ODOO_16: true
      ODOO_DB_SERVER: odoodb
      ODOO_DB_USERNAME: ${ODOO_DB_USER:?}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:?}
      OPENMRS_HOST: ${OPENMRS_HOST:?}
      OPENMRS_PORT: ${OPENMRS_PORT:?}
      OPENMRS_ATOMFEED_USER: ${OPENMRS_ATOMFEED_USER:?}
      OPENMRS_ATOMFEED_PASSWORD: ${OPENMRS_ATOMFEED_PASSWORD:?}
      OPENELIS_HOST: ${OPENELIS_HOST:?}
      OPENELIS_PORT: ${OPENELIS_PORT:?}
      OPENELIS_ATOMFEED_USER: ${OPENELIS_ATOMFEED_USER:?}
      OPENELIS_ATOMFEED_PASSWORD: ${OPENELIS_ATOMFEED_PASSWORD:?}
      ODOO_HOST: ${ODOO_HOST:?}
      ODOO_PORT: ${ODOO_PORT:?}
      ODOO_ATOMFEED_USER: ${ODOO_ATOMFEED_USER:?}
      ODOO_ATOMFEED_PASSWORD: ${ODOO_ATOMFEED_PASSWORD:?}
    ports:
      - 8002:8002
    depends_on:
      odoodb:
        condition: service_healthy

  atomfeed-console:
    image: '${ATOMFEED_CONSOLE_IMAGE_NAME:?}:${ATOMFEED_CONSOLE_IMAGE_TAG:?[ERROR]}'
    profiles: ["atomfeed-console"]
    restart: ${RESTART_POLICY}
    environment:
      TZ: ${TZ}
      OPENMRS_DB_HOST: ${OPENMRS_DB_HOST}
      OPENMRS_DB_NAME: ${OPENMRS_DB_NAME}
      OPENMRS_DB_USERNAME: ${OPENMRS_DB_USERNAME}
      OPENMRS_DB_PASSWORD: ${OPENMRS_DB_PASSWORD}
      ODOO_DB_HOST: ${ODOO_DB_HOST}
      ODOO_DB_NAME: ${ODOO_DB_NAME}
      ODOO_DB_USER: ${ODOO_DB_USER}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD}
      OPENELIS_DB_HOST: ${OPENELIS_DB_HOST}
      OPENELIS_DB_USER: ${OPENELIS_DB_USER}
      OPENELIS_DB_PASSWORD: ${OPENELIS_DB_PASSWORD}
      # PACS_INTEGRATION_DB_HOST: ${PACS_DB_HOST}
      # PACS_INTEGRATION_DB_NAME: ${PACS_INTEGRATION_DB_NAME}
      # PACS_INTEGRATION_DB_USERNAME: ${PACS_INTEGRATION_DB_USERNAME}
      # PACS_INTEGRATION_DB_PASSWORD: ${PACS_INTEGRATION_DB_PASSWORD}

  sms-service:
    image: '${SMS_SERVICE_IMAGE_NAME:?}:${SMS_SERVICE_IMAGE_TAG:?}'
    profiles: ["sms"]
    restart: ${RESTART_POLICY}
    environment:
      TZ: ${TZ}
      SMS_TOKEN: ${SMS_TOKEN}
      SMS_PROVIDER_API: ${SMS_PROVIDER_API}
      SMS_ORIGINATOR: ${SMS_ORIGINATOR}
      SMS_OPENMRS_HOST: ${OPENMRS_HOST:?}
      SMS_OPENMRS_PORT: ${OPENMRS_PORT:?}
      SMS_COUNTRY_CODE: ${SMS_COUNTRY_CODE}
      SMS_ORIGINATOR_WAPP: ${SMS_ORIGINATOR_WAPP}
      SMS_PROVIDER_WAPP_API: ${SMS_PROVIDER_WAPP_API}
    volumes:
      - 'sms-token:/opt/tokens'

  postgres:
    image: postgres:14
    profiles: ["license"]
    container_name: postgres-license
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: licensesdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  license-service:
    image: infoiplitin/license-management:iplit-0.0.4
    profiles: ["license"]
    restart: always
    depends_on:
      - postgres
    ports:
      - "8050:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/licensesdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: none  # Liquibase manages schema
      SPRING_LIQUIBASE_ENABLED: true 

  license-ui:
    image: infoiplitin/license-management-ui:iplit-0.0.7
    profiles: ["license"]
    ports:
      - "8070:80"

  storage:
   profiles: [ "storage" ]
   build:
     dockerfile: storage/Dockerfile
   ports:
     - "5050:5050"
   volumes:
     - //var/run/docker.sock:/var/run/docker.sock 


  superset:
    image: apache/superset:5.0.0-dev 
    container_name: superset
    profiles: ["superset"]
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: change-me
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://superset:superset@superset-db:5432/superset
      SUPERSET_ENABLE_PROXY_FIX: True
      PREFERRED_URL_SCHEME: https
      #SUPERSET_WEBSERVER_BASEURL: https://medapp-test.bharathmedicare.com/superset
      SUPERSET_CONFIG_PATH: /app/superset_2fa/superset_config.py
      TWO_FACTOR_AUTH_ENABLED: "true"
      SUPERSET_OTP_BYPASS_USERS: "admin,superman,sagar"
      OTP_SMS_TEMPLATE: "Your OTP {otp} to login into Bharath Medicare app."
      NETTY_DLT_TEMPLATE_ID: "1077330390098083445"
      NETTY_API_URL: http://retailsms.nettyfish.com/api/mt/SendSMS
      NETTY_USER: ${NETTY_USER}
      NETTY_PASSWORD: ${NETTY_PASSWORD}
      NETTY_SENDERID: BHMCIN
      NETTY_CHANNEL: Trans
      NETTY_ROUTE: "28"
      NETTY_PEID: ${NETTY_PEID}


    depends_on:
      - superset-db
    volumes:
      - superset_home:/app/superset_home
      - ./superset-2fa/superset_config.py:/app/superset_2fa/superset_config.py:ro
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py
      #- ./superset_config.py:/app/pythonpath/superset_config.py


  superset-db:
    image: postgres:16
    container_name: superset-db
    profiles: [superset]
    restart: unless-stopped
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - superset_db_data:/var/lib/postgresql/data


